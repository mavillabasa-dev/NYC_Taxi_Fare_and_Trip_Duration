# Formatting and linting run before each commit, so the mixed tabs/spaces this repo
# accumulated cannot come back.
#
# Install once per clone:
#     pip install -r requirements-dev.txt
#     pre-commit install
#
# Run against everything without committing:
#     pre-commit run --all-files
#
# Configuration for both tools lives in pyproject.toml, not here, so editors and CI
# read the same settings.

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
        # Formatting is black's job in this repo; ruff-format would fight it.
        stages: [manual]

  - repo: https://github.com/psf/black
    rev: 26.5.1
    hooks:
      - id: black

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-added-large-files
        # dataset/ and models/ are gitignored, but this catches an artifact committed
        # by accident before it reaches the history.
        args: [--maxkb=1024]
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: [--fix=lf]

exclude: |
  (?x)^(
      notebooks/.*
    | ppt/.*
    | dataset/taxi_zones\.geojson
  )$
